name: Shell syntax and offline tests
on:
  push:
  pull_request:
jobs:
  offline-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Bash and POSIX sh syntax
        run: |
          bash -n bin/pi-panctl
          sh -n install.sh
          sh -n uninstall.sh
          bash -n tests/test_guardian.sh
          bash -n tests/test_installer_dryrun.sh
      - name: Offline mock tests
        run: |
          sudo bash tests/test_guardian.sh
          sudo bash tests/test_installer_dryrun.sh
      - name: Manifest consistency
        run: sha256sum -c MANIFEST.sha256
